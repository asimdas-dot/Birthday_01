<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make A Wish My Queen ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 overflow-x-hidden">
    <div class="fixed inset-0 pointer-events-none z-0"><div class="absolute top-1/4 left-1/4 w-96 h-96 bg-pink-500/10 rounded-full blur-3xl animate-pulse"></div><div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl animate-pulse"></div></div>
    <main class="w-full max-w-xl z-10 flex flex-col items-center">
        <div class="text-center mb-6"><span class="inline-block px-4 py-1.5 rounded-full bg-pink-500/10 text-pink-400 text-xs font-semibold tracking-wider uppercase border border-pink-500/20 mb-3">✨ Happy Birthday Baby ✨</span><h1 class="text-4xl sm:text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400">Blow Out The Candle! 🎂</h1><p id="instruction" class="text-slate-400 mt-2 text-sm sm:text-base">Your birthday cake is getting ready...</p></div>
        <div class="w-full backdrop-blur-xl bg-slate-900/60 border border-slate-800 p-8 rounded-3xl shadow-2xl flex flex-col items-center relative overflow-hidden">
            <div id="statusBadge" class="mb-6 px-4 py-1 rounded-full text-xs font-semibold bg-pink-500/20 text-pink-300 border border-pink-500/30">🎂 Your birthday cake is getting ready...</div>
            <div id="cakeContainer">
                <div class="velas" id="candle"><div id="flamesGroup"><div class="fuego"></div><div class="fuego"></div><div class="fuego"></div><div class="fuego"></div><div class="fuego"></div></div><div class="smoke hidden" id="smoke"></div></div>
                <svg id="cake" width="200" height="500" viewBox="0 0 200 500" xmlns="http://www.w3.org/2000/svg" aria-label="Birthday cake"><g class="cake-art"><rect x="26" y="412" width="148" height="64" rx="8" fill="#a88679"/><rect x="26" y="396" width="148" height="20" fill="#8b6a60"/><rect x="26" y="350" width="148" height="48" rx="8" fill="#d39b83"/><rect x="26" y="334" width="148" height="20" fill="#8b6a60"/><rect x="26" y="290" width="148" height="46" rx="8" fill="#e5b49b"/><path d="M26 290c12 12 24-12 37 0s24 12 37 0 24-12 37 0 24 12 37 0" fill="none" stroke="#fff1e6" stroke-width="7"/><rect x="10" y="476" width="180" height="4" fill="#fefae9"/></g></svg>
            </div>
            <div id="actionControls" class="w-full flex flex-col gap-3 mt-6 z-20 opacity-0 pointer-events-none transition-opacity duration-500"><button id="blowBtn" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold tracking-wide shadow-lg flex items-center justify-center gap-2"><i class="fa-solid fa-wind"></i> Click to Blow Candle</button><button id="cutBtn" class="hidden w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-rose-500 to-amber-500 text-white font-bold tracking-wide shadow-lg flex items-center justify-center gap-2">🍴 Cut The Cake! 🔪</button><a id="enterHubBtn" href="main.html" class="hidden w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white font-extrabold tracking-wider text-center">ENTER CELEBRATION HUB ➜</a></div>
        </div>
    </main>
    <div id="eatModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300"><div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full text-center"><div class="text-6xl mb-4">🍰</div><h3 class="text-2xl font-black text-pink-300">A Piece Of Cake For You!</h3><p class="text-xs text-slate-400 mt-2">Open wide, gorgeous!</p><button id="eatSliceBtn" class="w-full mt-6 py-3 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 font-bold text-white">Take A Bite! 😋</button></div></div>
    <script src="js/cake.js"></script>
</body>
</html>
